# Insider Scanner front door.
#
# This file previously contained NO auth_basic at all, while the live server had
# it added by hand. deploy.sh installs this file, so any rebuild or drift served
# the whole dashboard, and every mutating endpoint, to the internet. It is now
# closed by default.
#
# Two credentials are accepted, via `satisfy any`:
#   auth_basic    staff, direct access
#   auth_request  a Wisepub SSO session, for subscribers viewing the dashboard
#                 embedded in an iframe on vip.optionpit.com
#
# A missing /etc/nginx/.htpasswd-insider makes nginx return 403 at request time,
# so a half-finished install also fails closed. deploy.sh --setup generates it
# from BASIC_AUTH_USER / BASIC_AUTH_PASSWORD in the server .env, the same pair
# the application checks, and nginx forwards Authorization upstream so one
# browser prompt satisfies both layers.
#
# The exempt locations below must stay in lockstep with security.EXEMPT_PATHS in
# the application. tests/test_security.py pins that set with an equality assert
# so widening it is a deliberate edit; this file has no such guard, so check both.

server {
    server_name YOURDOMAIN.duckdns.org;

    gzip on;
    gzip_types text/html text/css application/javascript application/json text/plain;
    gzip_min_length 256;
    gzip_vary on;

    # Inherited by every location below that does not override them.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_connect_timeout 10s;
    proxy_send_timeout 300s;

    # ---------------------------------------------------------------------
    # Unauthenticated endpoints. Exact-match locations, never prefixes: a
    # prefix here would also expose anything sharing that prefix.
    # ---------------------------------------------------------------------

    # Uptime monitoring. Must stay reachable when auth is misconfigured, which
    # is also why the application returns 503 rather than crashing.
    location = /healthz {
        auth_basic off;
        proxy_pass http://127.0.0.1:8002;
    }

    location = /robots.txt {
        auth_basic off;
        proxy_pass http://127.0.0.1:8002;
    }

    # Authenticated by its own WEBHOOK_SECRET header, plus a body cap, a
    # per-check cooldown and a single-flight lock in the application.
    location = /webhook/alert {
        auth_basic off;
        proxy_pass http://127.0.0.1:8002;
    }

    # Authenticates itself with the signed Wisepub handover token, and is what
    # mints the session the auth_request below looks for. Must not require the
    # credential it is in the business of issuing.
    location = /sso {
        auth_basic off;
        proxy_pass http://127.0.0.1:8002;
    }

    # auth_request target. `internal` means nginx will only reach it via the
    # subrequest, never from a client. The body is dropped because the subrequest
    # only needs the cookie, and forwarding it would read the request body twice.
    location = /internal/sso-authz {
        internal;
        proxy_pass http://127.0.0.1:8002;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }

    # ---------------------------------------------------------------------
    # Everything else: staff Basic Auth OR a valid Wisepub session.
    # ---------------------------------------------------------------------

    location /static/ {
        satisfy any;
        auth_basic "Insider Scanner";
        auth_basic_user_file /etc/nginx/.htpasswd-insider;
        auth_request /internal/sso-authz;

        proxy_pass http://127.0.0.1:8002;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        satisfy any;
        auth_basic "Insider Scanner";
        auth_basic_user_file /etc/nginx/.htpasswd-insider;
        auth_request /internal/sso-authz;

        proxy_pass http://127.0.0.1:8002;
    }

    # certbot rewrites this to 443 with the certificate on first run. Until then
    # the site is plain HTTP, but both auth layers are already active, so the
    # window is not an exposure; deploy.sh warns about typing credentials there.
    #
    # Security response headers (CSP with frame-ancestors for the vip.optionpit.com
    # embed, nosniff, referrer policy, HSTS) are set by the application in
    # security.SecurityHeadersMiddleware, so they apply to 401 and 503 responses
    # too. The live server also includes a frame-vip snippet; keep the two from
    # emitting conflicting frame directives.
    listen 80;
}
