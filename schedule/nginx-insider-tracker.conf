# Insider Scanner front door.
#
# This is the PRE-certbot template. certbot --nginx rewrites it on first run to
# add `listen 443 ssl`, the certificate paths, and a separate :80 server block
# that 301s to HTTPS. Do not hand-add those here or certbot will duplicate them.
#
# Reconciled against the live server on 2026-07-26. The previously committed
# version of this file was a REGRESSION against production: it had no TLS, no
# frame snippet, no AI-crawler block, no staff-only rule for the mutating
# endpoints, and pointed at a per-app htpasswd that is not the house convention.
# Installing it would have broken HTTPS and loosened access control. Keep this
# file in step with /etc/nginx/sites-enabled/insider-tracker, which is a REAL
# FILE on the live box, not a symlink.
#
# Access control, in order of specificity:
#
#   exact-match public locations   no credential at all
#   regex mutating endpoints       Basic Auth ONLY (staff), no SSO path
#   /static/ and /                 satisfy any: Basic Auth OR a Wisepub session
#
# The regex block is what keeps a paying subscriber from editing thresholds or
# the watchlist. The application enforces the same rule independently in
# security.verify_mutation (a staff check, not just CSRF), so the two layers are
# belt and braces rather than either being load-bearing alone.
#
# The exempt locations here mirror security.EXEMPT_PATHS; tests/test_nginx_config.py
# compares the two so they cannot drift apart silently.

server {
    server_name YOURDOMAIN.duckdns.org;

    # Framing policy is owned by this shared snippet, not by this file, so every
    # app on the droplet answers the question the same way. It emits its own
    # Content-Security-Policy carrying only frame-ancestors; the application
    # sends the remaining directives and repeats the SAME frame-ancestors value,
    # so the two policies intersect to exactly that value rather than
    # accidentally tightening it. See _shared/deploy.md.
    include snippets/frame-vip.conf;

    gzip on;
    # Live currently sets only gzip on/min_length/vary, which means nginx gzips
    # text/html and nothing else. Listing the types the dashboard actually serves
    # is a safe win; apply it to the live file when reconciling. text/html is
    # deliberately absent: it is always included, and repeating it makes nginx -t
    # emit a duplicate-MIME-type warning.
    gzip_types text/css application/javascript application/json text/plain;
    gzip_min_length 256;
    gzip_vary on;

    # ---------------------------------------------------------------------
    # Public. Exact-match locations, never prefixes: `location /healthz` would
    # also exempt /healthz-admin and anything else sharing the prefix.
    # ---------------------------------------------------------------------

    # Served from disk, not proxied, so crawler rules survive an app outage.
    location = /robots.txt {
        alias /var/www/insider/robots.txt;
        add_header Content-Type text/plain;
    }

    # Uptime monitors. Must stay reachable when auth is misconfigured, which is
    # also why the application returns 503 rather than refusing to start.
    location = /healthz {
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Healthchecks.io / BetterStack. Authenticated by its own WEBHOOK_SECRET
    # header, plus a body cap, a per-check cooldown and a single-flight lock in
    # the application.
    location = /webhook/alert {
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Wisepub SSO handover. No auth_basic: the request carries a JWT signed with
    # the shared secret and the app verifies it. A password prompt here would
    # break Wisepub's redirect into the iframe, and this is the endpoint that
    # mints the session the auth_request below looks for.
    location = /sso {
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # auth_request target. 204 when the request carries a valid Wisepub session
    # cookie, 401 otherwise. `internal` means nginx only reaches it via the
    # subrequest, never from a client. The body is dropped because the subrequest
    # needs only the cookie.
    location = /internal/sso-authz {
        internal;
        proxy_pass http://127.0.0.1:8002/internal/sso-authz;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Original-URI $request_uri;
    }

    # ---------------------------------------------------------------------
    # Editorial writes: staff only. Deliberately WITHOUT satisfy any /
    # auth_request, so a Wisepub subscriber session is not sufficient. Regex
    # locations are matched before the prefix `location /` below.
    #
    # /watchlist/(add|remove|toggle) was in this list until 2026-07-27 and was
    # deliberately removed: subscribers now keep their own watchlists, so those
    # routes have to be reachable with an SSO session and nothing else. They are
    # NOT unguarded as a result; enforcement moved into the app:
    #
    #   security.SUBSCRIBER_WRITABLE_PATHS  lifts only the staff requirement,
    #                                       CSRF still applies
    #   app.require_watch_owner             derives the owner from the session,
    #                                       never from form input
    #   queries.remove_watch                carries the owner in its DELETE
    #
    # Config and performance writes stay here, so a subscriber session can never
    # edit thresholds or fire a test alert.
    # ---------------------------------------------------------------------
    location ~ ^/(logic/(save|test-alert)|performance/(add|remove))$ {
        auth_basic "Option Pit Research";
        auth_basic_user_file /etc/nginx/.htpasswd;
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # ---------------------------------------------------------------------
    # Everything else: staff Basic Auth OR a valid Wisepub session.
    # ---------------------------------------------------------------------

    location /static/ {
        if ($http_user_agent ~* "(GPTBot|ChatGPT-User|OAI-SearchBot|CCBot|PerplexityBot|Bytespider|SemrushBot)") {
            return 403;
        }
        satisfy any;
        auth_request /internal/sso-authz;
        auth_basic "Option Pit Research";
        auth_basic_user_file /etc/nginx/.htpasswd;
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        if ($http_user_agent ~* "(GPTBot|ChatGPT-User|OAI-SearchBot|CCBot|PerplexityBot|Bytespider|SemrushBot)") {
            return 403;
        }
        satisfy any;
        auth_request /internal/sso-authz;
        auth_basic "Option Pit Research";
        auth_basic_user_file /etc/nginx/.htpasswd;
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
    }

    listen 80;
}
